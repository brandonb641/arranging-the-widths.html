
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Rent Audi Vehicles</title>
    <link rel="stylesheet" href="rental.css">
</head>
<body>

    <form action="#" method="POST">
        <fieldset>
            <legend>Rent Audi Vehicles</legend>

            <label for="name">Named</label>
            <input type="text"
                   id="name"
                   name="name"
                   placeholder="Enter your name">

            <label for="car">Select</label>
            <select id="car" name="car">
                <option>Audi 80</option>
                <option>Audi A3</option>
                <option>Audi A4</option>
                <option>Audi A6</option>
            </select>

            <label for="message">Select</label>
            <label for="message">Message:</label>
            <textarea id="message"
                      name="message"></textarea>

        </fieldset>
    </form>

</body>
</html>
